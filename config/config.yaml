# CreatorVetter Configuration
# Edit this file to tune thresholds, niche definitions, and column names.
# No code changes needed — everything reads from here.

# ─────────────────────────────────────────────
# INPUT CSV COLUMN NAMES
# ─────────────────────────────────────────────
input_columns:
  url: "Profile URL"    # Column containing Instagram profile URL (or null)
  username: "Username"  # Column containing plain username / @handle (or null)
  # All other columns are preserved in the output as-is

# ─────────────────────────────────────────────
# MODASH RAW API SETTINGS
# ─────────────────────────────────────────────
modash:
  base_url: "https://api.modash.io/v1"
  reels_per_creator: 7      # Max reels to download and analyze per creator
  requests_per_second: 2    # Rate limit for API requests

# ─────────────────────────────────────────────
# WHISPER TRANSCRIPTION
# ─────────────────────────────────────────────
whisper:
  model_size: "tiny"       # Options: tiny, base, small, medium, large
                           # tiny  = fastest, less accurate (~5s/reel on CPU)
                           # base  = good balance (~15s/reel on CPU)
                           # small = more accurate (~30s/reel on CPU)
  language: null           # null = auto-detect, or set "en" to force English
  device: "auto"           # auto = use GPU if available, else CPU

# ─────────────────────────────────────────────
# CLIP VISUAL ANALYSIS
# ─────────────────────────────────────────────
clip:
  model: "ViT-B-32"
  pretrained: "openai"
  frames_per_second: 0.5   # Extract 1 frame every 2 seconds

# CLIP zero-shot prompts per niche.
# Each niche gets a list of text descriptions — CLIP scores each frame
# against all prompts and averages the confidence. Add/edit prompts here
# to tune classification accuracy for your specific content types.
clip_prompts:
  "Health & Wellness":
    - "person meditating or doing yoga"
    - "healthy meal preparation"
    - "wellness morning routine"
    - "vitamins and supplements"
    - "mental health self care"
    - "herbal tea and relaxation"
    - "juice cleanse or smoothie"

  "Fitness":
    - "gym workout exercise"
    - "weight training lifting weights"
    - "running jogging outdoors"
    - "home workout exercise"
    - "protein shake post workout"
    - "athletic sportswear workout clothes"
    - "personal trainer coaching"
    - "HIIT cardio exercise"

  "Fashion":
    - "fashion outfit of the day"
    - "clothing haul try on"
    - "stylish outfit look"
    - "shopping bags clothing store"
    - "model posing in clothes"
    - "accessories jewellery handbag"
    - "streetwear fashion style"

  "Lifestyle":
    - "daily vlog lifestyle content"
    - "morning routine at home"
    - "home decor interior design"
    - "travel destination photography"
    - "coffee shop aesthetic"
    - "productivity work from home"
    - "cooking at home kitchen"

  "Beauty & Skincare":
    - "makeup tutorial beauty routine"
    - "skincare routine products"
    - "foundation lipstick cosmetics"
    - "before and after skincare"
    - "hair styling tutorial"
    - "nail art manicure"

  "Food & Beverage":
    - "food recipe cooking"
    - "restaurant meal dining"
    - "baking dessert cake"
    - "street food tasting"
    - "coffee barista drink"
    - "wine cocktail beverage"

# ─────────────────────────────────────────────
