# ─────────────────────────────────────────────
# NICHE FUSION WEIGHTS
# ─────────────────────────────────────────────
# How to combine visual (CLIP) and transcript signals.
# Must sum to 1.0
analysis_weights:
  visual: 0.6
  transcript: 0.4

# Which niches are your primary target verticals (for brand_fit_score)
target_niches:
  - "Health & Wellness"
  - "Fitness"
  - "Fashion"
  - "Lifestyle"

# ─────────────────────────────────────────────
# ENGAGEMENT THRESHOLDS (as % rates)
# ─────────────────────────────────────────────
engagement_thresholds:
  excellent: 6.0    # >= 6% engagement rate
  good: 3.0         # >= 3%
  average: 1.0      # >= 1%
  # below 1% = poor

# ─────────────────────────────────────────────
# POSTING FREQUENCY (posts per 30 days)
# ─────────────────────────────────────────────
frequency_thresholds:
  active: 8         # >= 8 posts/month
  occasional: 3     # >= 3 posts/month
  # below 3 = inactive

# Days since last post before flagging as stale
recency_flag_days: 30

# ─────────────────────────────────────────────
# SCORING WEIGHTS (must sum to 1.0)
# ─────────────────────────────────────────────
quality_weights:
  engagement_rate: 0.40
  audience_quality: 0.30
  posting_frequency: 0.20
  recency: 0.10

# ─────────────────────────────────────────────
# TIER THRESHOLDS (based on overall_quality_score 0–100)
# ─────────────────────────────────────────────
tier_thresholds:
  A: 75
  B: 50
  C: 25
  # below 25 = D

# ─────────────────────────────────────────────
# LLM ANALYSIS (optional — requires ANTHROPIC_API_KEY)
# Runs after CLIP + keyword analysis. Adds llm_* columns to the output CSV.
# Set enabled: false to skip (no API calls, no cost).
# ─────────────────────────────────────────────
llm_analysis:
  enabled: true
  brand_context: >
    Health, wellness, and lifestyle brands targeting women 25–45.
    Looking for authentic creators in beauty, fitness, nutrition,
    collagen, skincare, and healthy living who genuinely use and
    believe in the products they promote.
  target_niches:
    - "Health & Wellness"
    - "Fitness"
    - "Beauty & Skincare"
    - "Lifestyle"
    - "Food & Beverage"

# ─────────────────────────────────────────────
# QUALITY GATE
# Universal disqualifiers — creators tripping ANY of these are NOT pushed
# to the central agency database, even if their brand_fit is high for the
# current client. The rule of thumb: a fail here means this creator is wrong
# for ANY Augmentum client, not just this one.
#
# Brand-fit mismatches (wrong niche, wrong size, wrong demographic) are
# client-specific and recorded in the vetting result without blocking
# central-DB entry — a creator wrong for Kloris may be right for Elavate.
#
# Outputs three new columns on every enriched row:
#   gate_decision  — "passes" | "rejected_<category>"
#   gate_reason    — human-readable explanation
#   push_to_spine  — boolean
# ─────────────────────────────────────────────
quality_gate:
  enabled: true

  # llm_brand_safety below this triggers a universal reject even without a
  # specific keyword match — Claude saw something we didn't enumerate.
  min_brand_safety_floor: 30

  # llm_recommendation values that trigger a universal reject. By default
  # we DON'T put "no" here — "no" is often client-specific brand-fit, not
  # universal disqualification. A creator can be "no for Kloris" and "yes
  # for Elavate". Only put unambiguous-disqualifier signals here.
  exclude_recommendations: []

  # Pattern dictionaries — case-insensitive substring match against
  # llm_concerns + llm_reasoning + llm_content_summary + transcript_sample +
  # detected_scenes. Any hit in any category triggers a universal reject.
  #
  # These map directly to the "Hard Reject" rows in knowledge/expertise.md.
  # Soft rejects (extreme diet culture, partisan politics, etc.) are
  # client-overridable and don't belong here.
  universal_reject_patterns:
    adult_sexual_content:
      - "onlyfans"
      - "fansly"
      - "fanvue"
      - "justforfans"
      - "manyvids"
      - "explicit sexual"
      - "explicit nudity"
      - "visible genitalia"
      - "sex work"
      - "adult content platform"
      - "subscription adult"
      - "thirst trap"
      - "NSFW"
      - "spicy content"
      - "18+ content"

    mlm:
      - "MLM"
      - "multi-level marketing"
      - "Herbalife"
      - "Arbonne"
      - "Optavia"
      - "Modere"
      - "Beachbody"
      - "Amway"
      - "Plexus"
      - "Isagenix"
      - "Young Living distributor"
      - "doTERRA distributor"

    eating_disorder_advocacy:
      - "pro-eating-disorder"
      - "pro-ana"
      - "pro-mia"
      - "disordered eating advocacy"
      - "anorexia advocacy"
      - "bulimia advocacy"
      - "thinspiration"

    pseudo_medical:
      - "cancer cure"
      - "miracle cure"
      - "anti-chemotherapy"
      - "pseudo-medical claim"
      - "cure-all protocol"
      - "natural cancer treatment"

    anti_medical_advocacy:
      - "anti-vaccine"
      - "anti-vax"
      - "anti-psychiatry"
      - "anti-medication"
      - "vaccine conspiracy"
      - "vaccines cause autism"

    political_extremism:
      - "white nationalist"
      - "neo-nazi"
      - "QAnon"
      - "election denial"
      - "deep state"
      - "great replacement"
      - "accelerationist"

    hate_speech:
      - "hate speech"
      - "racial slur"
      - "antisemitic"
      - "homophobic content"
      - "transphobic content"
      - "ableist content"

    harassment_illegal:
      - "doxxing"
      - "harassment campaign"
      - "active harassment"
      - "illegal drug sale"

    religious_extremism:
      - "religious extremism"
      - "religious fundamentalism"
      - "anti-LGBTQ religious content"
      - "evangelical condemnation"

  # Soft floors — used in addition to the keyword patterns. If a row has all
  # of: llm_brand_safety < soft_floor AND tier == "D" AND llm_recommendation == "no",
  # we treat it as a universal reject even without a keyword match (a creator
  # that bad on every dimension probably has something we didn't enumerate).
  multi_signal_floor:
    enabled: true
    brand_safety_below: 50
    require_tier_d: true
    require_no_recommendation: true
