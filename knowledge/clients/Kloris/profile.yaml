brand_context: |
  KLORIS is a premium UK-based wellness brand selling botanical and CBD-derived
  products for calm, sleep, recovery, and pain management. Originally CBD-led
  (handle was @kloriscbd), repositioned in April 2026 as a broader premium
  wellness brand (@kloris.co) — CBD is now one ingredient, not the identity.

  Product range includes: Sleep Patches, Sleep Mist, Calm & Glow Face Oil,
  Discovery Set (gateway), muscle & joint patches/balms, gua sha, eye masks.
  Operates a paid affiliate programme (30% commission) and a seeded gifting
  programme. Active client; campaign runs monthly with new product focus per
  month (e.g. May = Sleep Mist outreach, June = Sleep Mist + Face Oil briefs).

  Brand voice is calm, premium, ritual-led. Sleep, recovery, and quiet
  performance are recurring themes — not hustle culture, not flashy fitness.
  Pedram (founder/co-lead) and Kim Smith are the client-side leads. Mia Leeks
  (Augmentum) leads the account. Mark McKee leads discovery against this brief.

  STRATEGIC PIVOT (Apr 2026, from Pedram/Kim): moving AWAY from deal-led,
  review-only creators in price-mismatched audiences (Chronic Pain, Endometriosis,
  Busy Mums being phased out — products are too premium for those audiences'
  spend). Moving TOWARD trust-led creators whose audiences have genuine
  disposable income and already buy premium. Examples cited:
    - Monty Don-style middle-aged gardening enthusiasts
    - Corporate professionals managing stress and performance
    - Senior finance (accountants) and legal people with a following
    - Equestrian and country lifestyle
    - Nature lovers, gardeners (e.g. authors like Lucy Jones, podcasts like
      @alicevincentwrites)
    - Doctors and credible natural wellness advocates
    - Dancers, athletes, high-pressure corporate jobs (female 35+)
  Strong on-brand reference creators: @emmajanegallagher (cited as their
  strongest on-brand creator), @julieyourfeelgoodgirl, @definedstyling,
  @evelynscott1987 (86k, organic fan), @astridiwantyouinmylife,
  @thejenniferwalsh, @katherinemay_.

scoring_notes: |
  HARD FILTERS:
    - Female creators, age 35+. Male creators and under-35 creators are
      out-of-brief unless they fit one of the niche carve-outs (e.g. male
      doctors with credible wellness practice).
    - UK primary market. EU acceptable (they ship via Netherlands warehouse
      to most of Europe). US and other geos out-of-brief unless specifically
      requested.
    - Premium-leaning audience signals required. Reject creators whose
      audience appears price-led, deal-hunting, or under £30k household income
      bracket.

  STRONGLY PREFER:
    - Trust-led creators with editorial credibility (writers, podcasters,
      doctors, credentialed practitioners) over pure product reviewers.
    - Engaged audiences over follower count. A 5k–50k creator with genuine
      community beats a 200k creator whose comments are emoji-only or bot-like.
    - Calm / ritual / slow-living aesthetic. Sleep, recovery, gentle wellness,
      country lifestyle, nature, considered routines.
    - Niches actively being expanded: Menopause, Health Educators, Fitness
      (dance/athlete/high-pressure-corporate), Nature Lovers, Horse Girl
      (equestrian), Busy Professionals, Mums (premium-skewing only),
      Busy Lifestyle.

  DEPRIORITISE / PHASE OUT (April 2026 client decision):
    - Chronic Pain niche — audience price-mismatch, do not actively source
    - Endometriosis niche — same reason
    - "Busy Mums" niche if audience reads budget/coupon-driven
    - Pure product-review accounts with no point of view
    - Affiliates who haven't generated meaningful content or sales in 2+ months

  Sales-conversion-friendly content is a plus but not the primary KPI —
  content quality and brand alignment matter more. The agency is shifting
  toward paid-content briefs (£50 bonus per spec content), so creators who
  can produce structured branded video are valuable.

