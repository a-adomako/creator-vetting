brand_context: |
  THRIVIN (formerly known under a different IG handle, repositioned in
  Feb 2026 to @thrivin) is a premium UK gymwear brand. The hero range is
  the Elevate™ Sculpting collection — Seamless Halterneck Tops, Mid Waist
  Scrunch Shorts, jumpsuits — sold in colourways like Dark Mauve, Merlot
  and Cotton Pink. Brand voice positions itself as "the UK's fastest-growing
  gymwear brand" and trades on premium fit / sculpting fabrication / brand
  community rather than discount.

  Operates separate UK and EU storefronts. Affiliate platform is Superfiliate
  (had a tech freeze through mid-May 2026; gifting paused intermittently).
  Affiliate offer: 15% commission (above gymwear market norm), 10% discount
  code for the creator's followers, free Thrivin product on signup, plus
  invitations to Thrivin events and shoots.

  Founder lead: Toya Ordor. Day-to-day approver: Shai Lubrun (works part-time,
  Mon/Thu/Fri — creator batches go to her for sign-off). Other internal
  stakeholders: Thara (paid/audience data), Carolina Sousa (operations),
  Anjela (unboxing/packaging budget). Augmentum side: Atlanta leads the
  account, Hannah runs on-the-ground outreach + relationship building.

  STRATEGIC SHAPE OF THE BRIEF (clarified through Jan–April 2026):
    - UK PRIMARY. They pushed back hard when a batch of 597 vetted creators
      came in with only 17 UK-based; everything else was rejected for being
      US-skewed. Anything outside UK/EU is out of brief by default.
    - 10k+ follower minimum (set Jan 2026). Engagement rate must be
      reported alongside follower count in any sheet sent for approval.
    - Audience demographics matter — they want roughly 50% UK audience
      split on creators they approve.
    - Two creator buckets: "Gymfluencers" (the original focus) and
      "Lifestyle" (added later — premium gym + lifestyle aesthetic, not
      generic fashion). Lifestyle is the harder of the two and the one
      that needs the tightest filtering.
    - Product is currently optimised for gym/fitness only. Yoga and broader
      lifestyle products are in Q3–Q4 pipeline (not live yet), so creators
      whose entire identity is yoga or non-gym wellness are off-brief for
      now.

  REFERENCE BRANDS THE CREATOR'S WARDROBE SHOULD READ LIKE:
    - On-brand neighbours: Oddmuse, premium UK gymwear, premium lifestyle.
      Atlanta explicitly flagged this on 2026-03-05.
    - Off-brand neighbours (instant scepticism): Boohoo, Fashion Nova,
      anything that reads fast-fashion / discount-driven / hyper-trend.
    - Past creators they approved as "standouts": pulled from the seeded
      gymfluencer batches (e.g. taylormctaggart0807, oliviakeighleyx,
      ellieprendergast2004, sumanaxo, beccaahernstyling, julesjessicaenquiries,
      veryvanriel, aishaeabu0406, alegnagomes3) — these are useful as
      lookalike anchors when judging new candidates.
    - Khaleel-vetted UK gymfluencer approvals (Apr–May 2026 batch, separate
      from Shai's seeded set above — useful as a second lookalike anchor
      pool): coachedby.molly, leannefisher, hanalicious.food, fsb.fit,
      gracey.fit, abbbfitness, jemmifit, alannahw.fitness, meliefituk,
      amylouise.pt, lhea.terzaki, sarahwinstanleyfit, chloes.health,
      fernsfitnessuk, vikkihillpt, leanlioness, rachelwoolford, gymwithshim,
      molliebeyondcoaching, bec_foodandfitness, paigecharlotte.empwr,
      emilyj.tri.

  CAMPAIGN STATUS AS OF 2026-06-07:
    - Active live campaign concluded around end of April / early May 2026.
    - Sambhav's read internally: relationship is intact and Augmentum is
      well-placed to work with Thrivin again. There will be an internal
      campaign wrap-up in early June. Train this client now so we're ready
      when the brief reopens.

scoring_notes: |
  HARD FILTERS (a "no" on any of these is automatic):
    - Geo: UK primary. EU acceptable as supporting market. US-only creators
      out of brief unless explicitly requested.
    - Follower count: 10,000+ unless the creator is a clear standout with
      exceptional engagement and clear brand fit (rare carve-out, document
      the reason).
    - Engagement rate must be reported — accounts with sub-1% engagement at
      this size are usually inauthentic growth.
    - Audience demographics — target ~50% UK audience split. Creators with
      audiences predominantly outside UK/EU don't fit.

  STRONGLY PREFER:
    - Gym/fitness creators with premium aesthetic (lifting, athletic
      training, sculpting / body composition focus, gym-floor content).
    - Lifestyle creators whose wardrobe and aesthetic neighbour Oddmuse,
      premium athleisure brands — gym pieces that double as elevated daily
      wear, not fast-fashion-haul energy.
    - UK creators with engaged communities (long comments, conversation,
      not emoji strings or bot replies).
    - Creators who would credibly attend a Thrivin event (Barry's, One
      Rebel, run clubs, fitness classes) — that community fit is the
      Augmentum-side play.
    - Modest-friendly silhouettes flagged where relevant (one approved
      creator @mellowfitness2.0 needed extra pieces to make her set work for
      her — useful signal that modest-leaning creators can still be on-brief,
      just route them through size/coverage check).

  DEPRIORITISE / REJECT:
    - Boohoo / Fashion Nova / Pretty Little Thing-style fast-fashion-aligned
      creators — Atlanta's specific note 2026-03-05.
    - US-only or US-primary creators.
    - Yoga-as-identity creators (product range isn't there yet).
    - Hyper-revealing / borderline-explicit gym content — Shai rejected
      candidates whose posts read more sexualised-fitness than premium-fit
      (specific examples given on 2026-01-30).
    - Pure "model" accounts with no fitness substance — Thrivin wants
      community-builders, not lookbook subjects.
    - Sub-10k follower creators except for documented standouts.

  REJECTION TAXONOMY (Khaleel's vocabulary from the Apr–May 2026 vetting
  pass — use these labels when explaining a 'no' so future runs stay
  consistent with how the human team thinks about rejections):
    - "Wrong aesthetics" — grid/vibe doesn't fit premium UK gymwear (most
      common reject). Off-palette, off-tone, off-styling — even if the
      creator is on-niche and on-geo.
    - "Too masculine" — bodybuilder / strongwoman / heavy-powerlifter
      physique and content. Distinct from "wrong aesthetics" — the gym
      content is real but the visual identity is too far from Thrivin's
      sculpted-femme positioning.
    - "Bodybuilder" / "Powerlifter" / "Athlete" / "Runner" — competitive-
      sport identity. Thrivin's range isn't built for these niches yet.
      Hard reject even if UK-based and engaged.
    - "Not enough gym" — too much lifestyle, not enough training content.
      The gym pieces wouldn't read credibly on this grid.
    - "Talking content" — talking-head-dominated grid. Thrivin wants
      training/aesthetic content, not commentary.
    - "Old gym content" / dormant — gym content present but stale, or
      account has gone quiet. Reject for seeding cadence reasons.
    - "Not English" / "Not based in US/UK" — fails the geo filter even
      when the aesthetic would work.
    - "Page not found" / "Private account" — operationally unworkable;
      drop without scoring.
    - "Pregnant" — defer rather than reject; flag for re-vet post-partum.
    - "No big booty / no booty fit" — physique doesn't suit the hero
      scrunch-shorts product line. Use this signal sparingly and only as
      a secondary downgrade, never as a sole reason — but it IS in the
      house vocabulary.

  VIP TIER (Khaleel marked a separate "VIP" bucket — these are NOT
  rejections, they're profiles too big or too high-leverage for the
  standard outreach flow and need bespoke handling):
    - Examples flagged in the Apr–May 2026 sheet: alixsmallll, linzblog,
      saarahallan, brittcarterr, isabellarosefitness, gabbiearmstrong,
      annieopenshaw, victoria_goulbourne, astridrubyharris, anojakrb,
      aliyah_salah, chloeanton3, beewalliscoach, claudiabutt0n.
    - Behaviour: route VIP candidates to a separate review channel rather
      than pushing them through the standard gifting pipeline. Atlanta /
      Toya decision required before any outreach.

  THINGS TO FLAG (not rejects, but call out for human review):
    - Creators whose posting cadence dropped off in the last 60 days —
      Thrivin needs creators who actually post when seeded.
    - Creators with declared sizes above XL — Thrivin's Elevate™ Halterneck
      currently doesn't extend past L in some SKUs; flag so size/SKU can
      be matched before gifting.
    - Creators with declared "modest" or "covered" aesthetic — workable but
      needs coverage piece (jacket / longer top) to be sent with the set.

